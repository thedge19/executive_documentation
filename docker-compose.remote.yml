version: '3.8'
services:
  storage:
    image: nginx:alpine
    container_name: exec_doc_storage
    ports:
      - "9000:80"  # Порт для доступа к файлам
    volumes:
      - uploads_volume:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    command: [ "sh", "-c", "chown -R nginx:nginx /usr/share/nginx/html && nginx -g 'daemon off;'" ]
    networks:
      - app-network

  postgres:
    image: postgres:16.1-alpine
    container_name: exec_doc_postgres
    environment:
      POSTGRES_DB: exec_doc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d exec_doc_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  postgres_data:
  uploads_volume:

networks:
  app-network:
    driver: bridge