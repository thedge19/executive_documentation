services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exec_doc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # Упрощённые настройки Hikari (уберите сложные параметры)
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"

      # JPA настройки
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

      FILE_UPLOAD_DIR: /app/uploads/pdf  # Путь внутри контейнера
      APP_BASE_URL: http://storage:80  # Базовый URL для доступа к файлам
    volumes:
      - uploads_volume:/app/uploads  # Монтирование тома для загрузок
      - ./application.properties:/app/config/application.properties  # Монтирование конфига
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8080
      NODE_ENV: development
    depends_on:
      - backend

  storage:
    image: nginx:alpine
    ports:
      - "9000:80"
    volumes:
      - uploads_volume:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    labels:
      - "com.example.description=PDF storage"
    command: [ "sh", "-c", "chown -R nginx:nginx /usr/share/nginx/html && nginx -g 'daemon off;'" ]

  postgres:
    image: postgres:16.1-alpine
    ports:
      - "5432:5432"  # Проброс порта для локального доступа
    environment:
      POSTGRES_DB: exec_doc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_HOST_AUTH_METHOD: "md5"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d exec_doc_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
  uploads_volume:
    driver: local