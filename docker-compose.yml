  postgres:
    image: postgres:16.1-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: exec_doc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # <-- Вот это важно!
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d exec_doc_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
  pdf_storage: # <-- Добавлен новый том для PDF-файлов
    driver: local