services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # БД
      SPRING_DATASOURCE_URL: jdbc:postgresql://95.81.123.142:5432/exec_doc_db
      SPRING_DATASOURCE_USERNAME: main_admin
      SPRING_DATASOURCE_PASSWORD: MainAdminPass456!
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # JPA настройки
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

      # === НАСТРОЙКИ MINIO (X-FILE-STORAGE) ===
      DROMARA_X_FILE_STORAGE_DEFAULT_PLATFORM: minio-1
      DROMARA_X_FILE_STORAGE_MINIO_0_PLATFORM: minio-1
      DROMARA_X_FILE_STORAGE_MINIO_0_ENABLE_STORAGE: "true"
      DROMARA_X_FILE_STORAGE_MINIO_0_ACCESS_KEY: admin
      DROMARA_X_FILE_STORAGE_MINIO_0_SECRET_KEY: uqNHZ_7hbg
      DROMARA_X_FILE_STORAGE_MINIO_0_END_POINT: http://95.81.123.142:9000
      DROMARA_X_FILE_STORAGE_MINIO_0_BUCKET_NAME: executive-docs
      DROMARA_X_FILE_STORAGE_MINIO_0_BASE_PATH: pdf/
      DROMARA_X_FILE_STORAGE_MINIO_0_DOMAIN: http://95.81.123.142:9000/executive-docs/
      DROMARA_X_FILE_STORAGE_MINIO_0_SECURE: "false"
      DROMARA_X_FILE_STORAGE_MINIO_0_PATH_STYLE_ACCESS: "true"

    volumes:
      - ./application.properties:/app/config/application.properties
      - ./backend:/app
    #  ⚠️ Volume uploads_volume больше не нужен - удалён

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8080
      NODE_ENV: development
    depends_on:
      - backend